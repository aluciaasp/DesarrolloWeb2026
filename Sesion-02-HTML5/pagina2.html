<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Portal de Cine</title>
</head>
<body>
  <header>
    <h1>Contacto</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="pagina1.html">Películas</a></li>
        <li><a href="pagina2.html">Contacto</a></li>
        <li><a href="pagina3.html">Acerca de</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Ponte en contacto</h2>
<p>Envíanos tus sugerencias o dudas sobre el catálogo de películas.</p>

     
      <form action="#" method="post">
        <p>
          <label for="nombre">Nombre:</label><br>
          <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
        </p>
        
        <p>
          <label for="email">Correo electrónico:</label><br>
          <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
        </p>

        <p>
          <label for="mensaje">Mensaje:</label><br>
          <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Escribe tu mensaje aquí..."></textarea>
        </p>

        <button type="submit">Enviar mensaje</button>
      </form>    
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Portal de Cine</p>
  </footer>
</body>
</html>
